# Advent Calendar Gifts Configuration
# Define gifts for each day of the advent calendar

# Format:
# day-X:
#   groups:
#     group-name:
#       items:
#         - type: ITEM/COMMAND/PERMISSION
#           (item-specific properties)

# Days 1-25
day-1:
  groups:
    default:
      items:
        - type: "ITEM"
          material: "DIAMOND"
          amount: 1
          name: "&b&lDay 1 Diamond"
          lore:
            - "&7A special gift for day 1!"
    vip:
      items:
        - type: "ITEM"
          material: "DIAMOND"
          amount: 3
          name: "&b&lDay 1 VIP Diamond"
          lore:
            - "&7A special VIP gift!"
        - type: "COMMAND"
          command: "give {player} emerald 5"

